<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stats Hub</title>
    <style>
      :root {
        --bg: #f6f5f0;
        --fg: #22211f;
        --muted: #77746c;
        --card: #fff;
        --line: #ddd9cd;
        --accent: #4a63d8;
        --bad: #b9483e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1b1a;
          --fg: #ecebe6;
          --muted: #9b988f;
          --card: #262624;
          --line: #4a4944;
          --accent: #7e92f0;
          --bad: #ee7a73;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      }
      #root {
        max-width: 860px;
        margin: 0 auto;
        min-height: 100dvh;
      }
      .center {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        padding: 24px;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .err {
        color: var(--bad);
        font-size: 13px;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--card);
        padding: 8px 14px;
        border-radius: 10px;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        padding: 10px 20px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        font-weight: 700;
        color: inherit;
        text-decoration: none;
      }
      .user {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--muted);
      }
      main {
        padding: 20px;
      }
      .app-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }
      .app-list a {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
      }
      .app-list a:hover {
        border-color: var(--accent);
      }
      .stat-cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin: 16px 0 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .card .num {
        font-size: 26px;
        font-weight: 700;
      }
      .card .label {
        font-size: 12px;
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 24px;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      td.muted {
        white-space: normal;
        word-break: break-all;
      }
      h1 {
        margin: 0;
      }
      h2 {
        margin: 8px 0 0;
      }
      h3 {
        font-size: 14px;
        color: var(--muted);
        margin: 20px 0 8px;
      }
      @media (max-width: 600px) {
        .stat-cards {
          grid-template-columns: repeat(2, 1fr);
        }
        table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
