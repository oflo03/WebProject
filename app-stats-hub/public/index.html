<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stats Hub</title>
    <style>
      :root {
        --bg: #f5f8ef;
        --fg: #22301f;
        --muted: #6f8267;
        --card: #ffffff;
        --line: #e1ead6;
        --accent: #2f9e6b;
        --accent-2: #f7cf59;
        --bad: #d85a4a;
        --line-2: #3f73d8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16201a;
          --fg: #eaf3e4;
          --muted: #93a68b;
          --card: #1f2b21;
          --line: #2c3a2b;
          --accent: #5cc292;
          --accent-2: #f7cf59;
          --bad: #f08a7c;
          --line-2: #7fa8ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      }
      #root {
        max-width: 880px;
        margin: 0 auto;
        min-height: 100dvh;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .err {
        color: var(--bad);
        font-size: 13px;
      }
      button,
      a.button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--card);
        padding: 8px 14px;
        border-radius: 12px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 22px 24px 10px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 800;
        font-size: 20px;
        color: inherit;
        text-decoration: none;
        letter-spacing: -0.3px;
      }
      .brand .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent);
      }
      main {
        padding: 8px 24px 40px;
      }
      .tagline {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 22px;
      }
      .app-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 12px;
      }
      .app-list a {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
        box-shadow: 0 2px 0 var(--line);
        transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      }
      .app-list a:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 18%, transparent);
      }
      .app-list .icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--accent-2) 35%, var(--card));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .app-list strong {
        font-size: 16px;
      }
      .crumb-sep {
        color: var(--muted);
        font-size: 20px;
      }
      header .crumb {
        margin: 0;
        font-size: 20px;
      }
      .back-link {
        margin-left: auto;
        color: var(--accent);
        font-size: 13px;
        text-decoration: none;
        font-weight: 600;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 24px;
        letter-spacing: -0.4px;
      }
      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .title-row h2 {
        margin: 0;
      }
      #refresh {
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        border-color: var(--line);
      }
      #refresh:hover {
        border-color: var(--accent);
      }
      h3 {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 28px 0 10px;
      }
      .stat-cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin: 18px 0 8px;
      }
      .stat-cards.cols-3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .stat-cards.cols-2 {
        grid-template-columns: repeat(2, 1fr);
      }
      .stat-cards.cols-1 {
        grid-template-columns: 1fr;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .card .num {
        font-size: 28px;
        font-weight: 800;
        color: var(--accent);
      }
      .card .label {
        font-size: 12px;
        color: var(--muted);
      }
      .table-wrap {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
      }
      .chart-wrap {
        padding: 10px 8px 0;
      }
      .chart-wrap svg {
        display: block;
        height: auto;
      }
      .chart-caption {
        margin: 14px 0 6px;
      }
      .chart-head {
        margin: 14px 0 6px;
        flex-wrap: wrap;
      }
      .chart-head .chart-caption {
        margin: 0;
      }
      .chart-tabs {
        display: flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
      }
      .chart-tabs button {
        border: 0;
        background: transparent;
        padding: 6px 14px;
        border-radius: 10px;
        color: var(--muted);
      }
      .chart-tabs button[aria-selected='true'] {
        background: var(--accent);
        color: var(--card);
        font-weight: 600;
      }
      .chart-legend {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 10px 0;
        font-size: 12px;
        color: var(--muted);
      }
      .chart-legend .key {
        width: 14px;
        height: 3px;
        border-radius: 2px;
        margin-left: 8px;
      }
      .key.starts {
        background: var(--accent);
      }
      .key.clears {
        background: var(--line-2);
      }
      .chart-grid {
        stroke: var(--line);
        stroke-width: 1;
      }
      .chart-line {
        fill: none;
        stroke-width: 2.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .chart-line.starts {
        stroke: var(--accent);
      }
      .chart-line.clears {
        stroke: var(--line-2);
      }
      .chart-dot {
        stroke: var(--card);
        stroke-width: 2;
      }
      .chart-dot.starts {
        fill: var(--accent);
      }
      .chart-dot.clears {
        fill: var(--line-2);
      }
      .chart-num {
        font-size: 10px;
        font-weight: 600;
        text-anchor: middle;
      }
      .chart-num.starts {
        fill: var(--accent);
      }
      .chart-num.clears {
        fill: var(--line-2);
      }
      .chart-label {
        font-size: 10px;
        fill: var(--muted);
        text-anchor: middle;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      select {
        font: inherit;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 7px 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        text-align: left;
        padding: 10px 14px;
        background: color-mix(in srgb, var(--accent) 10%, var(--card));
        color: var(--muted);
        font-weight: 700;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        white-space: nowrap;
      }
      td {
        text-align: left;
        padding: 9px 14px;
        border-top: 1px solid var(--line);
        white-space: nowrap;
      }
      tbody tr:nth-child(even) {
        background: color-mix(in srgb, var(--accent) 4%, transparent);
      }
      td.muted {
        white-space: normal;
        word-break: break-all;
      }
      @media (max-width: 600px) {
        .stat-cards.cols-3 {
          grid-template-columns: repeat(1, 1fr);
        }
        header,
        main {
          padding-left: 16px;
          padding-right: 16px;
        }
        .stat-cards {
          grid-template-columns: repeat(2, 1fr);
        }
        .table-wrap {
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
